version: "3.8"

networks:
  jenkins-net:
    driver: bridge
  shared-net:
    external: true
    name: shared-net

volumes:
  jenkins-data: {}

services:
  jenkins:
    build: 
      context: .
      dockerfile: Jenkins-Dockerfile
    user: "1000:137"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: jenkins
    environment:
      - TZ=Asia/Seoul
    restart: always
    networks:
      - jenkins-net
      - shared-net
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9002:8080"
      - "50000:50000"
    env_file:
      - ./.env
    group_add:
      - "317"