networks:
  jenkins-net:
    driver: bridge
  shared-net:
    # codevi 스택이 이미 만든 네트워크를 재사용 (새로 만들지 않음)
    external: true
    name: shared-net

volumes:
  jenkins-data: {}

services:
  jenkins:
    build:
      context: .
      dockerfile: Jenkins-Dockerfile
    container_name: jenkins
    # 호스트 docker.sock(gid 137) 접근용. 없으면 파이프라인의 docker 명령이 권한거부로 실패.
    group_add:
      - "137"
    env_file:
      - ./.env.prod
    environment:
      - TZ=Asia/Seoul
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
    restart: always
    networks:
      - jenkins-net
      - shared-net
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
    ports:
      - "9002:8080"
      - "50000:50000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - jenkins-net
      - shared-net
