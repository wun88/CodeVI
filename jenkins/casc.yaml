jenkins:
  systemMessage: "CodeVi Local Dev Jenkins - Configured via JCasC"
  numExecutors: 4

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          name: "Admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USERNAME:-}"
              password: "${GITHUB_TOKEN:-}"
              description: "GitHub PAT - used when Jenkins accesses user repos"

unclassified:
  location:
    url: "${JENKINS_EXTERNAL_URL:-http://localhost:9002/}"
    adminAddress: "noreply@localhost"

# JCasC 로 job-dsl 시드를 돌릴 때 스크립트 보안(승인 대기)을 끈다.
# (JCasC 는 신뢰된 SYSTEM 컨텍스트라 아래처럼 꺼야 아래 jobs 가 자동 생성됨)
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

# 파이프라인 잡들을 코드로 자동 생성 (Jenkins 켜질 때마다 보장). 수동 New Item 불필요.
# 유지 대상: CodeVi(CD), stable-baselines3-analysis(나이틀리). 나머지(SLF4J·requests)는 재현 안 함 = 폐기.
jobs:
  # ── CodeVi: master→Deploy 머지 시 자동 배포 (GitHub webhook 트리거)
  - script: |
      pipelineJob('CodeVi') {
        description('master→Deploy 머지 시 자동 배포. JCasC(job-dsl)로 생성됨.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/rlawogh1005/CodeVi.git')
                  credentials('github-credentials')
                }
                branch('*/Deploy')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
        triggers {
          githubPush()
        }
      }
  # ── stable-baselines3-analysis: 매일 22시경 나이틀리 분석 (cron)
  - script: |
      pipelineJob('stable-baselines3-analysis') {
        description('stable-baselines3 나이틀리 분석 (매일 22시경). JCasC(job-dsl)로 생성됨.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/rlawogh1005/stable-baselines3.git')
                  credentials('github-credentials')
                }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
        triggers {
          cron('H 22 * * *')
        }
        // 155G 재발 방지: 최근 10개 빌드만 보관
        logRotator {
          numToKeep(10)
        }
      }
