version: "3.8"

networks:
  codevi-backend-net:
    driver: bridge
  shared-net:
    external: true
    name: shared-net

# 공통 설정 (YAML anchor)
x-common-backend: &common-backend
  networks:
    - codevi-backend-net
    - shared-net
  depends_on:
    - db
  restart: always

x-common-env: &common-env
  SERVER_HOST: ${SERVER_HOST}
  SONAR_TOKEN: ${SONAR_TOKEN}
  NODE_ENV: production
  DATABASE_HOST: ${DATABASE_HOST:-codevi-db}
  DATABASE_PORT: 3306
  DATABASE_NAME: ${DATABASE_NAME:-codevi}
  DATABASE_USERNAME: ${DATABASE_USERNAME:-jaehokim}
  DATABASE_PASSWORD: ${USER_DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  TZ: Asia/Seoul
  AUTH_BEARER_TOKEN: ${BACKEND_AUTH_TOKEN}
  DEPLOY_FRONTEND_URL1: ${DEPLOY_FRONTEND_URL1}
  DEPLOY_FRONTEND_URL2: ${DEPLOY_FRONTEND_URL2}
  DEPLOY_FRONTEND_URL3: ${DEPLOY_FRONTEND_URL3}
  DEPLOY_FRONTEND_URL4: ${DEPLOY_FRONTEND_URL4}
  DEPLOY_FRONTEND_URL5: ${DEPLOY_FRONTEND_URL5}
  DEPLOY_FRONTEND_URL6: ${DEPLOY_FRONTEND_URL6}
  DEVELOP_FRONTEND_URL: ${DEVELOP_FRONTEND_URL}
  JENKINS_URL: ${JENKINS_URL}
  JENKINS_USER: ${JENKINS_USER}
  JENKINS_TOKEN: ${JENKINS_TOKEN}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
  NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI}
  FRONTEND_REDIRECT_URI: ${FRONTEND_REDIRECT_URI}
  PARSER_URL: ${PARSER_URL}
  # examine(/codegraph): 스니펫·ZIP 1회성 분석이 호출하는 언어별 품질 엔진.
  # 현재 배포된 컨테이너는 python 뿐 — c(3004)/java(3005)/ts(3006)를 띄우면
  # EXAMINE_LANGUAGES 에 추가해야 실제로 호출된다.
  EXAMINE_PYTHON_URL: ${EXAMINE_PYTHON_URL:-http://codevi-pyexamine:3003}
  EXAMINE_C_URL: ${EXAMINE_C_URL:-http://codevi-cexamine:3004}
  EXAMINE_JAVA_URL: ${EXAMINE_JAVA_URL:-http://codevi-jexamine:3005}
  EXAMINE_TS_URL: ${EXAMINE_TS_URL:-http://codevi-tsexamine:3006}
  EXAMINE_LANGUAGES: ${EXAMINE_LANGUAGES:-python}
  EXAMINE_TIMEOUT_MS: ${EXAMINE_TIMEOUT_MS:-20000}

services:
  # 통합 백엔드 (포트 13000) - Relational AST (Directory→File→Class→Function) 저장
  backend:
    build: .
    container_name: codevi-backend
    <<: *common-backend
    environment:
      <<: *common-env
      SERVER_PORT: "13000"
    # 호스트 포트 미공개(보안): 프론트 nginx(/api)·cloudflared 가 shared-net 으로
    # codevi-backend:13000 에 직접 접근. 외부 노출은 backend.refactory.store 터널로만.

  # ======================================================================
  # [LEGACY] 아래 서비스들은 비활성화됨.
  # 추후 HDD 별도 저장 아키텍처로 전환 시 재활용 예정.
  # 비활성화 일자: 2026-03-20
  # ======================================================================
  #
  # # V1: Relational AST (포트 13001) - Directory→File→Class→Function 정규화 저장
  # backend-relational:
  #   build: .
  #   container_name: codevi-backend-relational
  #   <<: *common-backend
  #   environment:
  #     <<: *common-env
  #     ENTRY_FILE: main-relational
  #     RELATIONAL_PORT: "13001"
  #   ports:
  #     - "13001:13001"
  #
  # # V2: JSON AST (포트 13002) - AST를 @Column('json')에 통째 저장
  # backend-json:
  #   build: .
  #   container_name: codevi-backend-json
  #   <<: *common-backend
  #   environment:
  #     <<: *common-env
  #     ENTRY_FILE: main-json
  #     JSON_PORT: "13002"
  #   ports:
  #     - "13002:13002"

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: codevi-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME:-codevi}
      - MYSQL_USER=${DATABASE_USERNAME:-jaehokim}
      - MYSQL_PASSWORD=${USER_DB_PASSWORD}
      - TZ=Asia/Seoul
    ports:
      # 외부(LAN/공개) 차단, 로컬 DB툴만 접근하도록 localhost 바인딩
      - "127.0.0.1:13306:3306"
    networks:
      - codevi-backend-net
      - shared-net
    volumes:
      - codevi-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  codevi-mysql-data:
